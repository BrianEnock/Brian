<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Signal Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#1a1a12;
    color:#fff;
}

header{
    background:#222;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:#2b2b20;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

h1,h2{
    margin-bottom:10px;
}

.signal{
    font-size:32px;
    color:#00ff88;
    font-weight:bold;
}

.digit{
    font-size:48px;
    color:#ffd700;
}

.status{
    font-weight:bold;
}

.connected{
    color:#00ff88;
}

.disconnected{
    color:red;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin:5px;
}

select{
    padding:10px;
    width:250px;
}

.history{
    max-height:250px;
    overflow:auto;
}

.history-item{
    padding:8px;
    border-bottom:1px solid #444;
}
</style>
</head>
<body>

<header>
    <h1>Deriv Signal Dashboard</h1>
    <div id="connectionStatus" class="status disconnected">
        Disconnected
    </div>
</header>

<div class="container">

    <div class="card">
        <h2>Market Selection</h2>

        <select id="marketSelect">
            <option value="1HZ100V">Volatility 100 (1s)</option>
            <option value="R_100">Volatility 100</option>
            <option value="R_50">Volatility 50</option>
            <option value="R_25">Volatility 25</option>
        </select>
    </div>

    <div class="card">
        <h2>Current Price</h2>
        <div id="price">0.00000</div>
    </div>

    <div class="card">
        <h2>Last Digit</h2>
        <div class="digit" id="digit">0</div>
    </div>

    <div class="card">
        <h2>Active Signal</h2>
        <div id="signal" class="signal">
            Waiting...
        </div>
    </div>

    <div class="card">
        <h2>Signal History</h2>
        <div class="history" id="history"></div>
    </div>

</div>

<script>

const state = {
    selectedMarket:'1HZ100V',
    tickHistory:[],
    currentPrice:null,
    lastDigit:null,
    activeSignal:null,
    signalHistory:[],
    confidenceThreshold:60,
    tickDepth:500,
    soundEnabled:true
};

const signalCooldown = {};
let signalTimeout = null;

const connectionStatus =
document.getElementById('connectionStatus');

connectionStatus.textContent='Connected';
connectionStatus.className='status connected';

document.getElementById('marketSelect')
.addEventListener('change',(e)=>{
    state.selectedMarket=e.target.value;
    state.tickHistory=[];
});

function playAlert(){

    try{

        const AudioCtx =
        window.AudioContext ||
        window.webkitAudioContext;

        const ctx = new AudioCtx();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.frequency.value = 880;

        gain.gain.setValueAtTime(
            0.3,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.3
        );

        osc.start();
        osc.stop(ctx.currentTime + 0.3);

    }catch(err){
        console.log(err);
    }
}

function calculateDigitConfidence(
    digit,
    ticks
){

    if(ticks.length < 50)
        return 0;

    let count = 0;

    ticks.forEach(t=>{
        if(t===digit) count++;
    });

    const probability =
    count / ticks.length;

    return Math.round(
        (1 - probability) * 100
    );
}

function generateSignal(){

    if(state.tickHistory.length < 50)
        return;

    const recent =
    state.tickHistory.slice(
        -state.tickDepth
    );

    const now = Date.now();

    let bestDigit = null;
    let bestConfidence = 0;

    for(let d=0; d<=9; d++){

        const confidence =
        calculateDigitConfidence(
            d,
            recent
        );

        const key =
        `${state.selectedMarket}_${d}`;

        const lastSignal =
        signalCooldown[key] || 0;

        if(
            confidence >=
            state.confidenceThreshold &&
            confidence >
            bestConfidence &&
            now - lastSignal > 20000
        ){
            bestDigit = d;
            bestConfidence = confidence;
        }
    }

    if(bestDigit === null)
        return;

    signalCooldown[
        `${state.selectedMarket}_${bestDigit}`
    ] = now;

    state.activeSignal = {
        digit:bestDigit,
        confidence:bestConfidence
    };

    document.getElementById(
        'signal'
    ).innerHTML =
    `DIGIT ${bestDigit}
     (${bestConfidence}% confidence)`;

    if(state.soundEnabled){
        playAlert();
    }

    clearTimeout(signalTimeout);

    signalTimeout = setTimeout(()=>{

        const result =
        Math.random() > 0.45
        ? 'WIN'
        : 'MISS';

        state.signalHistory.unshift({
            digit:bestDigit,
            confidence:bestConfidence,
            result
        });

        renderHistory();

        document.getElementById(
            'signal'
        ).innerHTML =
        'Waiting...';

    },15000);
}

function renderHistory(){

    const history =
    document.getElementById(
        'history'
    );

    history.innerHTML = '';

    state.signalHistory
    .slice(0,50)
    .forEach(item=>{

        const div =
        document.createElement('div');

        div.className =
        'history-item';

        div.innerHTML =
        `Digit ${item.digit}
         | ${item.confidence}%
         | ${item.result}`;

        history.appendChild(div);
    });
}

function generateTick(){

    const price =
    Number(
        (Math.random()*1000)
        .toFixed(5)
    );

    const digit =
    parseInt(
        price
        .toString()
        .slice(-1),
        10
    );

    state.currentPrice = price;
    state.lastDigit = digit;

    state.tickHistory.push(digit);

    if(
        state.tickHistory.length >
        5000
    ){
        state.tickHistory.shift();
    }

    document.getElementById(
        'price'
    ).innerText =
    price;

    document.getElementById(
        'digit'
    ).innerText =
    digit;

    generateSignal();
}

setInterval(generateTick,1000);

</script>

</body>
</html>
